<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HiperCore</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff3ed',
                            500: '#ff5500', // Laranja Neon
                            600: '#e64d00',
                            700: '#cc4400'
                        },
                        dark: {
                            bg: '#0a0a0c',      // Preto profundo
                            card: '#121215',    // Chumbo escuro
                            border: '#26262e',  // Cromado escuro
                            input: '#18181c',
                            hover: '#1e1e24'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        * { transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #26262e; border-radius: 9999px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media screen and (max-width: 768px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }

        .touch-active:active {
            transform: scale(0.96);
        }

        /* Chrome, Safari, Edge, Opera - Remove arrows from number input */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-gray-950 dark:bg-dark-bg text-gray-100 min-h-screen pb-24 antialiased selection:bg-brand-500 selection:text-white">

    <header class="sticky top-0 z-40 backdrop-blur-xl bg-gray-950/90 dark:bg-dark-bg/90 border-b border-gray-800 dark:border-dark-border">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
            
            <!-- Logo & Data -->
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-brand-500 flex items-center justify-center text-white font-black shadow-lg shadow-brand-500/30">
                    <i data-lucide="dumbbell" class="w-5 h-5"></i>
                </div>
                <div>
                    <span class="font-extrabold text-base sm:text-lg tracking-tight block leading-none text-white">HiperCore</span>
                    <span id="currentDateStr" class="text-[10px] text-gray-400 font-medium uppercase tracking-wider"></span>
                </div>
            </div>

            <!-- Botões de Ação no Topo -->
            <div class="flex items-center gap-1.5">
                <button id="openSupabaseModalBtn" class="min-h-[44px] px-3 py-2 text-xs font-semibold rounded-2xl border border-gray-800 dark:border-dark-border bg-dark-card hover:bg-dark-hover flex items-center gap-1.5 touch-active transition-all text-gray-300">
                    <div id="supabaseStatusDot" class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse"></div>
                    <span id="supabaseStatusText" class="hidden sm:inline text-xs">Nuvem</span>
                </button>

                <button id="openNewModalBtn" class="min-h-[44px] px-3.5 py-2 text-xs font-bold rounded-2xl bg-brand-500 hover:bg-brand-600 active:bg-brand-700 text-white flex items-center justify-center gap-1.5 shadow-lg shadow-brand-500/25 touch-active transition-all">
                    <i data-lucide="plus" class="w-4 h-4 stroke-[2.5]"></i>
                    <span class="hidden sm:inline">Novo Exercício</span>
                </button>
                
                <button id="themeToggleBtn" class="min-h-[44px] min-w-[44px] p-2.5 rounded-2xl border border-gray-800 dark:border-dark-border bg-dark-card text-gray-400 hover:text-white flex items-center justify-center touch-active transition-all">
                    <i data-lucide="moon" id="themeIcon" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- Categorias (Tabs Scrolláveis) -->
        <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar py-2.5 px-4 bg-dark-card/80 border-t border-gray-800/50 dark:border-dark-border/50" id="categoryTabs">
            <!-- Tabs renderizadas via JS sem a opção 'Todos' -->
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-4 space-y-4">

        <!-- Banner Bento Grid -->
        <section class="grid grid-cols-2 md:grid-cols-3 gap-3">
            <div class="col-span-2 p-4 sm:p-5 rounded-3xl border border-gray-800 dark:border-dark-border bg-dark-card flex flex-col justify-between shadow-lg relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-brand-500/10 rounded-full blur-2xl pointer-events-none"></div>
                <div>
                    <div class="flex items-center justify-between">
                        <span class="text-[10px] font-extrabold uppercase tracking-widest text-brand-500 bg-brand-500/15 border border-brand-500/20 px-2.5 py-1 rounded-xl">Treino Ativo</span>
                    </div>
                    <h1 id="currentCategoryTitle" class="text-lg sm:text-xl font-bold tracking-tight mt-2 text-white">Peito</h1>
                    <p class="text-xs text-gray-400 mt-0.5 hidden sm:block">Ajuste suas cargas e acompanhe sua evolução em tempo real.</p>
                </div>
            </div>

            <div class="col-span-2 sm:col-span-1 p-4 sm:p-5 rounded-3xl border border-gray-800 dark:border-dark-border bg-dark-card flex items-center justify-around gap-2 shadow-lg">
                <div class="text-center">
                    <span class="block text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Total</span>
                    <span id="totalExerciseCount" class="text-2xl font-black text-white">0</span>
                </div>
                <div class="h-8 w-px bg-gray-800 dark:bg-dark-border"></div>
                <div class="text-center">
                    <span class="block text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Com Carga</span>
                    <span id="savedWeightsCount" class="text-2xl font-black text-brand-500">0</span>
                </div>
            </div>
        </section>

        <!-- Barra de Busca -->
        <div class="relative">
            <i data-lucide="search" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
            <input type="text" id="searchInput" placeholder="Buscar exercício ou grupo muscular..." class="w-full pl-11 pr-10 py-3.5 text-sm rounded-2xl border border-gray-800 dark:border-dark-border bg-dark-card text-white focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all shadow-md placeholder-gray-500">
            <button id="clearSearchBtn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 p-1.5 rounded-xl text-gray-400 hover:text-white touch-active">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Lista de Exercícios -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-4" id="exerciseList"></section>

    </main>

    <div id="exerciseModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-dark-card border-t sm:border border-gray-800 dark:border-dark-border rounded-t-3xl sm:rounded-3xl max-w-lg w-full p-5 sm:p-6 shadow-2xl transform translate-y-full sm:translate-y-0 sm:scale-95 transition-all duration-300 max-h-[90vh] overflow-y-auto" id="modalContainer">
            
            <div class="w-12 h-1 bg-gray-700 rounded-full mx-auto mb-4 sm:hidden"></div>

            <div class="flex items-center justify-between pb-3 border-b border-gray-800 dark:border-dark-border">
                <h2 id="modalTitle" class="text-base font-bold text-white">Novo Exercício</h2>
                <button id="closeModalBtn" class="min-h-[44px] min-w-[44px] flex items-center justify-center rounded-xl text-gray-400 hover:text-white touch-active">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="exerciseForm" class="mt-4 space-y-4">
                <input type="hidden" id="editExerciseId">

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">Nome do Exercício *</label>
                    <input type="text" id="formName" required placeholder="Ex: Supino Reto com Barra" class="w-full px-3.5 py-3 text-sm rounded-xl border border-gray-800 dark:border-dark-border bg-dark-input text-white focus:outline-none focus:ring-2 focus:ring-brand-500/50">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">Grupo Muscular *</label>
                        <select id="formCategory" class="w-full px-3.5 py-3 text-sm rounded-xl border border-gray-800 dark:border-dark-border bg-dark-input text-white focus:outline-none focus:ring-2 focus:ring-brand-500/50">
                            <option value="peito">Peito</option>
                            <option value="costas">Costas</option>
                            <option value="pernas">Pernas</option>
                            <option value="ombros">Ombros</option>
                            <option value="biceps">Bíceps</option>
                            <option value="triceps">Tríceps</option>
                            <option value="abs">Abdômen</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">Séries / Repetições</label>
                        <input type="text" id="formSets" placeholder="Ex: 4x 10-12 reps" class="w-full px-3.5 py-3 text-sm rounded-xl border border-gray-800 dark:border-dark-border bg-dark-input text-white focus:outline-none focus:ring-2 focus:ring-brand-500/50">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">Músculos Alvo</label>
                    <input type="text" id="formTarget" placeholder="Ex: Peitoral maior" class="w-full px-3.5 py-3 text-sm rounded-xl border border-gray-800 dark:border-dark-border bg-dark-input text-white focus:outline-none focus:ring-2 focus:ring-brand-500/50">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider">URL da Imagem</label>
                        <button type="button" id="btnPresetImage" class="text-xs font-bold text-brand-500 hover:underline touch-active py-1">Usar Imagem Padrão</button>
                    </div>
                    <input type="url" id="formImage" placeholder="https://images.unsplash.com/..." class="w-full px-3.5 py-3 text-sm rounded-xl border border-gray-800 dark:border-dark-border bg-dark-input text-white focus:outline-none focus:ring-2 focus:ring-brand-500/50">
                </div>

                <div id="imagePreviewContainer" class="hidden rounded-2xl overflow-hidden h-32 border border-gray-800 dark:border-dark-border bg-black/40 relative">
                    <img id="imagePreview" src="" alt="Preview" class="w-full h-full object-contain p-2">
                </div>

                <div class="pt-3 flex items-center justify-end gap-3 pb-2 sm:pb-0">
                    <button type="button" id="cancelModalBtn" class="min-h-[44px] px-5 py-2.5 text-xs font-semibold text-gray-400 hover:bg-dark-hover rounded-2xl touch-active">Cancelar</button>
                    <button type="submit" class="min-h-[44px] px-6 py-2.5 text-xs font-bold bg-brand-500 hover:bg-brand-600 active:bg-brand-700 text-white rounded-2xl shadow-lg shadow-brand-500/20 touch-active">Salvar Exercício</button>
                </div>
            </form>
        </div>
    </div>

    <div id="supabaseModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-dark-card border-t sm:border border-gray-800 dark:border-dark-border rounded-t-3xl sm:rounded-3xl max-w-md w-full p-5 sm:p-6 shadow-2xl transform translate-y-full sm:translate-y-0 sm:scale-95 transition-all duration-300" id="supabaseModalContainer">
            
            <div class="flex items-center justify-between pb-3 border-b border-gray-800 dark:border-dark-border">
                <div class="flex items-center gap-2">
                    <i data-lucide="cloud" class="w-5 h-5 text-brand-500"></i>
                    <h2 class="text-base font-bold text-white">Conexão Supabase</h2>
                </div>
                <button id="closeSupabaseModalBtn" class="min-h-[44px] min-w-[44px] flex items-center justify-center rounded-xl text-gray-400 hover:text-white touch-active">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="supabaseForm" class="mt-4 space-y-4">
                <p class="text-xs text-gray-400">Insira suas credenciais do projeto Supabase para sincronizar treinos e cargas na nuvem.</p>

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">Project URL</label>
                    <input type="url" id="sbUrlInput" placeholder="https://xyz.supabase.co" class="w-full px-3.5 py-3 text-sm rounded-xl border border-gray-800 dark:border-dark-border bg-dark-input text-white focus:outline-none focus:ring-2 focus:ring-brand-500/50">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">Anon / Public API Key</label>
                    <input type="password" id="sbKeyInput" placeholder="eyJhbGciOiJIUzI1..." class="w-full px-3.5 py-3 text-sm rounded-xl border border-gray-800 dark:border-dark-border bg-dark-input text-white focus:outline-none focus:ring-2 focus:ring-brand-500/50">
                </div>

                <div class="pt-2 flex items-center justify-between gap-3">
                    <button type="button" id="disconnectSbBtn" class="text-xs font-bold text-red-500 hover:underline touch-active">Desconectar</button>
                    <button type="submit" class="min-h-[44px] px-6 py-2.5 text-xs font-bold bg-brand-500 hover:bg-brand-600 text-white rounded-2xl shadow-lg shadow-brand-500/20 touch-active">Salvar e Conectar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 sm:left-auto sm:right-6 sm:translate-x-0 px-5 py-3.5 bg-dark-card text-white rounded-2xl shadow-2xl border border-gray-800 dark:border-dark-border text-xs font-bold transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2.5 z-50">
        <div class="w-2.5 h-2.5 rounded-full bg-brand-500 animate-pulse"></div>
        <span id="toastMessage">Alterações salvas!</span>
    </div>

    <script>
        // Categorias do App (SEM a opção 'Todos')
        const CATEGORIES = [
            { id: 'peito', label: 'Peito', icon: 'shield' },
            { id: 'costas', label: 'Costas', icon: 'shield' },
            { id: 'pernas', label: 'Pernas', icon: 'square' },
            { id: 'ombros', label: 'Ombros', icon: 'dumbbell' },
            { id: 'biceps', label: 'Bíceps', icon: 'BicepsFlexed' },
            { id: 'triceps', label: 'Tríceps', icon: 'BicepsFlexed' },
            { id: 'abs', label: 'Abdômen', icon: 'disc' }
        ];

        // Estado do App
        let activeCategory = 'peito';
        let searchQuery = '';
        let exercises = [];
        let supabaseClient = null;
        let isSupabaseActive = false;
        let toastTimeout = null;

        // Exercícios Padrão Iniciais
        function getDefaultExercises() {
            return [
                { id: 'ex_1', name: 'Supino Reto com Barra', category: 'peito', sets: '4x 8-10', target: 'Peitoral Maior', weight: 60, unit: 'kg', image: 'https://images.unsplash.com/photo-1517838277536-f5f99be501cd?w=500&q=80' },
                { id: 'ex_2', name: 'Supino Inclinado Halteres', category: 'peito', sets: '3x 10-12', target: 'Peitoral Superior', weight: 24, unit: 'kg', image: 'https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=500&q=80' },
                { id: 'ex_3', name: 'Crossover no Cabo', category: 'peito', sets: '3x 12-15', target: 'Peitoral Medial', weight: 4, unit: 'barras', image: 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=500&q=80' },
                { id: 'ex_4', name: 'Puxada Alta Frontal', category: 'costas', sets: '4x 10-12', target: 'Latíssimo do Dorso', weight: 8, unit: 'barras', image: 'https://images.unsplash.com/photo-1605296867304-46d5465a13f1?w=500&q=80' },
                { id: 'ex_5', name: 'Remada Curvada', category: 'costas', sets: '4x 8-10', target: 'Dorso e Trapézio', weight: 50, unit: 'kg', image: 'https://images.unsplash.com/photo-1517838277536-f5f99be501cd?w=500&q=80' },
                { id: 'ex_6', name: 'Agachamento Livre', category: 'pernas', sets: '4x 8-10', target: 'Quadríceps e Glúteos', weight: 80, unit: 'kg', image: 'https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=500&q=80' },
                { id: 'ex_7', name: 'Leg Press 45°', category: 'pernas', sets: '4x 10-12', target: 'Quadríceps', weight: 160, unit: 'kg', image: 'https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=500&q=80' },
                { id: 'ex_8', name: 'Desenvolvimento Halteres', category: 'ombros', sets: '4x 10-12', target: 'Deltoide Anterior', weight: 18, unit: 'kg', image: 'https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=500&q=80' },
                { id: 'ex_9', name: 'Rosca Direta Barra W', category: 'biceps', sets: '3x 10-12', target: 'Bíceps Braquial', weight: 26, unit: 'kg', image: 'https://images.unsplash.com/photo-1530822847156-5df684618728?w=500&q=80' },
                { id: 'ex_10', name: 'Tríceps Corda Pulley', category: 'triceps', sets: '4x 12-15', target: 'Tríceps Braquial', weight: 6, unit: 'barras', image: 'https://images.unsplash.com/photo-1530822847156-5df684618728?w=500&q=80' },
                { id: 'ex_11', name: 'Abdominal Infra na Barra', category: 'abs', sets: '3x 15', target: 'Abdômen Inferior', weight: 0, unit: 'kg', image: 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=500&q=80' }
            ];
        }

        // --- TEMA (DARK / LIGHT) ---
        function initTheme() {
            const savedTheme = localStorage.getItem('hipercore_theme') || 'dark';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                if (themeIcon) themeIcon.setAttribute('data-lucide', 'moon');
            } else {
                document.documentElement.classList.remove('dark');
                if (themeIcon) themeIcon.setAttribute('data-lucide', 'sun');
            }
            lucide.createIcons();
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('hipercore_theme', isDark ? 'dark' : 'light');
            if (themeIcon) themeIcon.setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
            showToast(isDark ? 'Modo Escuro ativado' : 'Modo Claro ativado');
        }

        // --- SUPABASE & ARMAZENAMENTO ---
        function sanitizeUrl(url) {
            if (!url) return '';
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                return 'https://' + url;
            }
            return url;
        }

        function updateSupabaseStatusUI(connected) {
            const dot = document.getElementById('supabaseStatusDot');
            const text = document.getElementById('supabaseStatusText');
            const btn = document.getElementById('openSupabaseModalBtn');

            if (dot) {
                dot.className = connected 
                    ? 'w-2.5 h-2.5 rounded-full bg-[#00ff66] shadow-[0_0_10px_#00ff66]' 
                    : 'w-2.5 h-2.5 rounded-full bg-[#ff0055] shadow-[0_0_10px_#ff0055] animate-pulse';
            }

            if (btn) {
                if (connected) {
                    btn.className = "min-h-[44px] px-3 py-2 text-xs font-semibold rounded-2xl border border-[#00ff66]/40 bg-[#00ff66]/10 hover:bg-[#00ff66]/20 flex items-center gap-1.5 touch-active transition-all text-[#00ff66] shadow-[0_0_12px_rgba(0,255,102,0.2)]";
                } else {
                    btn.className = "min-h-[44px] px-3 py-2 text-xs font-semibold rounded-2xl border border-[#ff0055]/40 bg-[#ff0055]/10 hover:bg-[#ff0055]/20 flex items-center gap-1.5 touch-active transition-all text-[#ff0055] shadow-[0_0_12px_rgba(255,0,85,0.2)]";
                }
            }

            if (text) {
                text.textContent = connected ? 'Nuvem OK' : 'Nuvem Off';
            }
        }

        function initSupabase() {
            const url = localStorage.getItem('pulse_sb_url');
            const key = localStorage.getItem('pulse_sb_key');
            if (url && key && window.supabase) {
                try {
                    supabaseClient = window.supabase.createClient(url, key);
                    isSupabaseActive = true;
                    updateSupabaseStatusUI(true);
                    if (sbUrlInput) sbUrlInput.value = url;
                    if (sbKeyInput) sbKeyInput.value = key;
                } catch (err) {
                    console.error("Supabase init error:", err);
                    isSupabaseActive = false;
                    updateSupabaseStatusUI(false);
                }
            } else {
                isSupabaseActive = false;
                updateSupabaseStatusUI(false);
            }
        }

        async function fetchExercises() {
            if (isSupabaseActive && supabaseClient) {
                try {
                    const { data, error } = await supabaseClient.from('exercises').select('*');
                    if (!error && data && data.length > 0) {
                        exercises = data;
                        localStorage.setItem('hipercore_exercises', JSON.stringify(exercises));
                        renderExercises();
                        updateStats();
                        return;
                    }
                } catch (e) {
                    console.warn("Supabase fetch failed, fallback to local:", e);
                }
            }
            loadExercisesLocal();
            renderExercises();
            updateStats();
        }

        function loadExercisesLocal() {
            const saved = localStorage.getItem('hipercore_exercises');
            if (saved) {
                try {
                    exercises = JSON.parse(saved);
                } catch (e) {
                    exercises = [];
                }
            }
            if (!exercises || exercises.length === 0) {
                exercises = getDefaultExercises();
                localStorage.setItem('hipercore_exercises', JSON.stringify(exercises));
            }
        }

        async function saveExerciseDB(ex) {
            const idx = exercises.findIndex(e => String(e.id) === String(ex.id));
            if (idx !== -1) {
                exercises[idx] = ex;
            } else {
                exercises.unshift(ex);
            }
            localStorage.setItem('hipercore_exercises', JSON.stringify(exercises));

            if (isSupabaseActive && supabaseClient) {
                try {
                    await supabaseClient.from('exercises').upsert([ex]);
                } catch (e) {
                    console.error("Supabase save error:", e);
                }
            }
            updateStats();
        }

        async function deleteExerciseDB(id) {
            exercises = exercises.filter(e => String(e.id) !== String(id));
            localStorage.setItem('hipercore_exercises', JSON.stringify(exercises));

            if (isSupabaseActive && supabaseClient) {
                try {
                    await supabaseClient.from('exercises').delete().eq('id', id);
                } catch (e) {
                    console.error("Supabase delete error:", e);
                }
            }
            updateStats();
        }

        function updateStats() {
            const totalCount = document.getElementById('totalExerciseCount');
            const savedCount = document.getElementById('savedWeightsCount');
            if (totalCount) totalCount.textContent = exercises.length;
            if (savedCount) {
                const countWithWeight = exercises.filter(e => parseFloat(e.weight) > 0).length;
                savedCount.textContent = countWithWeight;
            }
        }

        // --- RENDERIZAÇÃO DE INTERFACE ---
        function renderCategoryTabs() {
            const container = document.getElementById('categoryTabs');
            if (!container) return;

            container.innerHTML = CATEGORIES.map(cat => `
                <button 
                    onclick="setCategory('${cat.id}')"
                    class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5 whitespace-nowrap transition-all duration-200 touch-active ${
                        activeCategory === cat.id 
                            ? 'bg-brand-500 text-white shadow-lg shadow-brand-500/25 scale-105 font-bold' 
                            : 'bg-dark-card text-gray-400 hover:text-white hover:bg-dark-hover border border-dark-border'
                    }">
                    <i data-lucide="${cat.icon}" class="w-4 h-4"></i>
                    <span>${cat.label}</span>
                </button>
            `).join('');
            
            lucide.createIcons();
        }

        function setCategory(catId) {
            activeCategory = catId;
            const currentCatObj = CATEGORIES.find(c => c.id === catId);
            if (currentCatObj) {
                currentCategoryTitle.textContent = currentCatObj.label;
            }
            renderCategoryTabs();
            renderExercises();
            triggerHaptic();
        }

        function renderExercises() {
            const list = document.getElementById('exerciseList');
            if (!list) return;

            // Filtra por Categoria e Busca
            const filtered = exercises.filter(e => {
                const matchesCategory = (e.category || '').toLowerCase() === activeCategory.toLowerCase();
                const matchesSearch = searchQuery === '' || 
                    (e.name || '').toLowerCase().includes(searchQuery.toLowerCase()) || 
                    (e.target || '').toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="col-span-full py-12 text-center text-gray-500">
                        <i data-lucide="dumbbell" class="w-12 h-12 mx-auto mb-3 stroke-1 opacity-40"></i>
                        <p class="text-base font-medium text-gray-400">Nenhum exercício encontrado</p>
                        <p class="text-xs text-gray-600 mt-1">Toque no botão "Novo Exercício" para adicionar.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            list.innerHTML = filtered.map(ex => {
                const currentUnit = ex.unit || 'kg';
                const currentWeight = ex.weight !== undefined && ex.weight !== null ? ex.weight : 0;

                return `
                <div class="bg-dark-card border border-dark-border rounded-3xl overflow-hidden shadow-xl transition-all duration-300 hover:border-brand-500/40 flex flex-col justify-between" data-id="${ex.id}">
                    <!-- Container de Imagem -->
                    <div class="relative w-full h-44 sm:h-52 bg-black flex items-center justify-center overflow-hidden cursor-pointer group" onclick="openImageModal('${ex.image || ''}')">
                        ${ex.image ? `
                            <img src="${ex.image}" alt="${ex.name}" class="w-full h-full object-contain p-2 transition-transform duration-300 group-hover:scale-105" onerror="this.onerror=null; this.src='https://placehold.co/600x400/121215/ff5500?text=Sem+Imagem';">
                        ` : `
                            <div class="flex flex-col items-center text-gray-600">
                                <i data-lucide="image" class="w-10 h-10 mb-1 opacity-40"></i>
                                <span class="text-xs">Sem Imagem</span>
                            </div>
                        `}
                        <div class="absolute top-3 right-3 bg-black/70 backdrop-blur-md px-2.5 py-1 rounded-xl text-[11px] font-bold text-brand-500 border border-brand-500/30 uppercase tracking-wider">
                            ${ex.category}
                        </div>
                    </div>

                    <!-- Informações do Exercício -->
                    <div class="p-4 space-y-3.5 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex items-start justify-between gap-2">
                                <div>
                                    <h3 class="text-base sm:text-lg font-bold text-white tracking-tight leading-snug">${ex.name}</h3>
                                    ${ex.target ? `<p class="text-xs text-gray-400 font-medium mt-0.5">${ex.target}</p>` : ''}
                                </div>
                                <div class="flex items-center gap-1 shrink-0">
                                    <button onclick="editExercise('${ex.id}')" class="p-2 text-gray-400 hover:text-white rounded-xl hover:bg-dark-hover transition-colors touch-active" title="Editar">
                                        <i data-lucide="edit-3" class="w-4 h-4"></i>
                                    </button>
                                    <button onclick="deleteExercise('${ex.id}')" class="p-2 text-gray-400 hover:text-red-500 rounded-xl hover:bg-dark-hover transition-colors touch-active" title="Excluir">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>

                            ${ex.sets ? `
                                <div class="mt-2.5 inline-flex items-center gap-1.5 px-3 py-1 rounded-xl bg-dark-input border border-dark-border text-xs font-semibold text-gray-300">
                                    <i data-lucide="repeat" class="w-3.5 h-3.5 text-brand-500"></i>
                                    <span>${ex.sets}</span>
                                </div>
                            ` : ''}
                        </div>

                        <!-- Controle de Carga Direta e Seletor de Unidade -->
                        <div class="bg-dark-input p-3 rounded-2xl border border-dark-border space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Carga</span>
                            </div>

                            <div class="grid grid-cols-12 gap-2 items-center pt-0.5">
                                <button onclick="adjustWeight('${ex.id}', -1)" class="col-span-3 h-11 bg-dark-hover hover:bg-brand-500/20 hover:text-brand-500 text-white font-black text-base rounded-xl transition-all border border-dark-border active:scale-95 touch-active flex items-center justify-center">
                                    -1
                                </button>

                                <div class="col-span-6 h-11 border border-dark-border bg-dark-card rounded-xl flex items-center justify-between px-2 focus-within:ring-2 focus-within:ring-brand-500/50 transition-all">
                                    <input 
                                        type="number" 
                                        step="1"
                                        min="0"
                                        value="${currentWeight}" 
                                        onchange="updateExerciseWeight('${ex.id}', this.value)"
                                        class="w-full h-full text-center font-black text-base bg-transparent text-white focus:outline-none min-w-0"
                                    />
                                    <span class="text-gray-600 font-light select-none px-1">|</span>
                                    <select onchange="updateExerciseUnit('${ex.id}', this.value)" class="h-full bg-transparent text-brand-500 font-extrabold text-xs focus:outline-none cursor-pointer border-none uppercase pr-1 shrink-0">
                                        <option value="kg" ${currentUnit === 'kg' ? 'selected' : ''} class="bg-dark-card text-white">KG</option>
                                        <option value="barras" ${currentUnit === 'barras' ? 'selected' : ''} class="bg-dark-card text-white">Barras</option>
                                    </select>
                                </div>

                                <button onclick="adjustWeight('${ex.id}', 1)" class="col-span-3 h-11 bg-dark-hover hover:bg-brand-500/20 hover:text-brand-500 text-white font-black text-base rounded-xl transition-all border border-dark-border active:scale-95 touch-active flex items-center justify-center">
                                    +1
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            }).join('');

            lucide.createIcons();
        }

        // --- AÇÕES DO USUÁRIO ---
        window.adjustWeight = function(id, delta) {
            const exIndex = exercises.findIndex(e => String(e.id) === String(id));
            if (exIndex !== -1) {
                let current = parseFloat(exercises[exIndex].weight) || 0;
                let updated = Math.max(0, current + delta);
                exercises[exIndex].weight = updated;
                
                saveExerciseDB(exercises[exIndex]);
                triggerHaptic();
                renderExercises();
            }
        };

        window.updateExerciseWeight = function(id, value) {
            const exIndex = exercises.findIndex(e => String(e.id) === String(id));
            if (exIndex !== -1) {
                const val = parseFloat(value);
                exercises[exIndex].weight = !isNaN(val) && val >= 0 ? val : 0;
                
                saveExerciseDB(exercises[exIndex]);
                triggerHaptic();
                showToast('Carga atualizada!');
                renderExercises();
            }
        };

        window.updateExerciseUnit = function(id, unitValue) {
            const exIndex = exercises.findIndex(e => String(e.id) === String(id));
            if (exIndex !== -1) {
                exercises[exIndex].unit = unitValue;
                saveExerciseDB(exercises[exIndex]);
                triggerHaptic();
                showToast('Unidade alterada!');
                renderExercises();
            }
        };

        window.openImageModal = function(src) {
            if (!src) return;
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 cursor-pointer animate-fadeIn';
            modal.onclick = () => modal.remove();
            modal.innerHTML = `
                <div class="relative max-w-2xl w-full bg-dark-card border border-dark-border p-3 rounded-3xl shadow-2xl">
                    <img src="${src}" class="w-full max-h-[80vh] object-contain rounded-2xl">
                    <p class="text-center text-xs text-gray-400 mt-2 font-medium">Toque em qualquer lugar para fechar</p>
                </div>
            `;
            document.body.appendChild(modal);
        };

        function triggerHaptic() {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        function openModal(isEdit = false) {
            modalTitle.textContent = isEdit ? 'Editar Exercício' : 'Novo Exercício';
            exerciseModal.classList.remove('opacity-0', 'pointer-events-none');
            modalContainer.classList.remove('translate-y-full', 'sm:scale-95');
            modalContainer.classList.add('translate-y-0', 'sm:scale-100');
            triggerHaptic();
        }

        function closeModal() {
            modalContainer.classList.remove('translate-y-0', 'sm:scale-100');
            modalContainer.classList.add('translate-y-full', 'sm:scale-95');
            exerciseModal.classList.add('opacity-0', 'pointer-events-none');
            exerciseForm.reset();
            editExerciseId.value = '';
            imagePreviewContainer.classList.add('hidden');
        }

        // --- HANDLERS DE EVENTOS ---
        openNewModalBtn.addEventListener('click', () => {
            exerciseForm.reset();
            editExerciseId.value = '';
            formCategory.value = activeCategory;
            imagePreviewContainer.classList.add('hidden');
            openModal(false);
        });

        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);

        openSupabaseModalBtn.addEventListener('click', () => {
            supabaseModal.classList.remove('opacity-0', 'pointer-events-none');
            supabaseModalContainer.classList.remove('translate-y-full', 'sm:scale-95');
            supabaseModalContainer.classList.add('translate-y-0', 'sm:scale-100');
        });

        closeSupabaseModalBtn.addEventListener('click', () => {
            supabaseModalContainer.classList.remove('translate-y-0', 'sm:scale-100');
            supabaseModalContainer.classList.add('translate-y-full', 'sm:scale-95');
            supabaseModal.classList.add('opacity-0', 'pointer-events-none');
        });

        supabaseForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = sanitizeUrl(sbUrlInput.value.trim());
            const key = sbKeyInput.value.trim();

            if (url && key) {
                localStorage.setItem('pulse_sb_url', url);
                localStorage.setItem('pulse_sb_key', key);
                initSupabase();
                await fetchExercises();
                showToast('Supabase Conectado!');
            }
            closeSupabaseModalBtn.click();
        });

        disconnectSbBtn.addEventListener('click', () => {
            localStorage.removeItem('pulse_sb_url');
            localStorage.removeItem('pulse_sb_key');
            supabaseClient = null;
            isSupabaseActive = false;
            updateSupabaseStatusUI(false);
            showToast('Modo Local Ativado.');
            closeSupabaseModalBtn.click();
            fetchExercises();
        });

        themeToggleBtn.addEventListener('click', toggleTheme);

        formImage.addEventListener('input', (e) => {
            const url = e.target.value.trim();
            if (url) {
                imagePreview.src = url;
                imagePreviewContainer.classList.remove('hidden');
            } else {
                imagePreviewContainer.classList.add('hidden');
            }
        });

        btnPresetImage.addEventListener('click', () => {
            const presetImages = {
                peito: 'https://images.unsplash.com/photo-1517838277536-f5f99be501cd?w=500&q=80',
                costas: 'https://images.unsplash.com/photo-1605296867304-46d5465a13f1?w=500&q=80',
                pernas: 'https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=500&q=80',
                ombros: 'https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=500&q=80',
                biceps: 'https://images.unsplash.com/photo-1530822847156-5df684618728?w=500&q=80',
                triceps: 'https://images.unsplash.com/photo-1530822847156-5df684618728?w=500&q=80',
                abs: 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=500&q=80'
            };
            const cat = formCategory.value || 'peito';
            formImage.value = presetImages[cat] || presetImages.peito;
            imagePreview.src = formImage.value;
            imagePreviewContainer.classList.remove('hidden');
            triggerHaptic();
        });

        exerciseForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = editExerciseId.value || 'ex_' + Date.now();
            const name = formName.value.trim();
            const category = formCategory.value;
            const sets = formSets.value.trim() || '3x 10 reps';
            const target = formTarget.value.trim() || '';
            const image = formImage.value.trim() || 'https://images.unsplash.com/photo-1517838277536-f5f99be501cd?w=500&q=80';

            const exObj = { id: String(id), name, category, sets, target, image, weight: 0, unit: 'kg' };

            if (editExerciseId.value) {
                const index = exercises.findIndex(e => String(e.id) === String(id));
                if (index !== -1) {
                    exObj.weight = exercises[index].weight || 0;
                    exObj.unit = exercises[index].unit || 'kg';
                    exercises[index] = exObj;
                    showToast('Exercício modificado!');
                }
            } else {
                exercises.unshift(exObj);
                showToast('Novo exercício adicionado!');
            }

            await saveExerciseDB(exObj);
            closeModal();
            renderExercises();
        });

        window.editExercise = function(id) {
            const ex = exercises.find(e => String(e.id) === String(id));
            if (!ex) return;

            editExerciseId.value = ex.id;
            formName.value = ex.name;
            formCategory.value = ex.category;
            formSets.value = ex.sets || '';
            formTarget.value = ex.target || '';
            formImage.value = ex.image || '';

            if (ex.image) {
                imagePreview.src = ex.image;
                imagePreviewContainer.classList.remove('hidden');
            }

            openModal(true);
        };

        window.deleteExercise = async function(id) {
            const ex = exercises.find(e => String(e.id) === String(id));
            if (!ex) return;

            if (confirm(`Deseja remover "${ex.name}"?`)) {
                await deleteExerciseDB(id);
                showToast('Exercício removido.');
                renderExercises();
            }
        };

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            if (searchQuery.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            renderExercises();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearchBtn.classList.add('hidden');
            renderExercises();
        });

        function showToast(msg) {
            const toastMessage = document.getElementById('toastMessage');
            if (toastMessage) toastMessage.textContent = msg;
            
            toast.classList.remove('translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 2000);
        }

        function setFormattedDate() {
            const options = { weekday: 'short', day: 'numeric', month: 'short' };
            const dateStr = document.getElementById('currentDateStr');
            if (dateStr) {
                dateStr.textContent = new Date().toLocaleDateString('pt-BR', options);
            }
        }

        // --- INICIALIZAÇÃO DA APLICAÇÃO ---
        window.onload = async function() {
            setFormattedDate();
            initTheme();
            initSupabase();
            renderCategoryTabs();
            await fetchExercises();
        };
    </script>
</body>
</html>
